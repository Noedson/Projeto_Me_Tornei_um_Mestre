services:
  # ============================================================================
  # 1. CAMADA LORAWAN: CHIRPSTACK v4 + GATEWAY BRIDGE + MOSQUITTO + POSTGRES + REDIS
  # ============================================================================
  postgres:
    image: postgres:14-alpine
    container_name: velha_postgres
    restart: unless-stopped
    volumes:
      - ./chirpstack-docker/configuration/postgresql/initdb:/docker-entrypoint-initdb.d
      - velha_postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=chirpstack
      - POSTGRES_DB=chirpstack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpstack -d chirpstack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: velha_redis
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - velha_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: velha_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./chirpstack-docker/configuration/mosquitto/config/:/mosquitto/config/

  chirpstack:
    image: chirpstack/chirpstack:4
    container_name: velha_chirpstack
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
      - ./chirpstack-docker/configuration/chirpstack:/etc/chirpstack
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
    ports:
      - "8080:8080"

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    container_name: velha_gateway_bridge
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    volumes:
      - ./chirpstack-docker/configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=au915_0/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=au915_0/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=au915_0/gateway/{{ .GatewayID }}/command/#
    depends_on:
      - mosquitto

  chirpstack-gateway-bridge-basicstation:
    image: chirpstack/chirpstack-gateway-bridge:4
    container_name: velha_gateway_bridge_basicstation
    restart: unless-stopped
    command: -c /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge-basicstation-au915_0.toml
    ports:
      - "3002:3001"
    volumes:
      - ./chirpstack-docker/configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    depends_on:
      - mosquitto

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    container_name: velha_chirpstack_rest_api
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "8090:8090"
    depends_on:
      - chirpstack

  # ============================================================================
  # 2. CAMADA DE ROTEAMENTO: NODE-RED (Porta 1880)
  #    Recebe Webhook do ChirpStack (/chirpstack) e envia ao Proxy (Porta 4000)
  # ============================================================================
  nodered:
    image: nodered/node-red:latest
    container_name: velha_nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered_data/flows.json:/data/flows.json
    depends_on:
      - chirpstack

  # ============================================================================
  # 3. CAMADA FIWARE + BANCO DE DADOS MONGODB (Orion, IoT-Agent, Mongo, Cygnus)
  # ============================================================================
  mongo-db:
    labels:
      org.fiware: 'tutorial'
    image: mongo:4.4
    hostname: mongo-db
    container_name: db-mongo
    expose:
      - "27017"
    ports:
      - "27017:27017"
    volumes:
      - velha_mongo_db:/data/db
    healthcheck:
      test: |
        host=`hostname --ip-address || echo '127.0.0.1'`;
        mongo --quiet $$host/test --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)' && echo 0 || echo 1
      interval: 5s

  orion:
    labels:
      org.fiware: 'tutorial'
    image: quay.io/fiware/orion:3.10.1
    hostname: orion
    container_name: fiware-orion
    depends_on:
      - mongo-db
    expose:
      - "1026"
    ports:
      - "1026:1026"
    command: -dbhost mongo-db -logLevel DEBUG
    healthcheck:
      test: curl --fail -s http://orion:1026/version || exit 1
      interval: 5s

  iot-agent:
    labels:
      org.fiware: 'tutorial'
    image: quay.io/fiware/iotagent-ul:3.0.0-distroless
    hostname: iot-agent
    container_name: fiware-iot-agent
    depends_on:
      - mongo-db
      - orion
    expose:
      - "4041"
      - "7896"
    ports:
      - "4041:4041"
      - "7896:7896"
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_LOG_LEVEL=DEBUG
      - IOTA_TIMESTAMP=true
      - IOTA_CB_NGSI_VERSION=v2
      - IOTA_AUTOCAST=true
      - IOTA_MONGO_HOST=mongo-db
      - IOTA_MONGO_PORT=27017
      - IOTA_MONGO_DB=iotagentul
      - IOTA_HTTP_PORT=7896
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_DEFAULT_RESOURCE=/iot/d

  tutorial:
    labels:
      org.fiware: 'tutorial'
    image: quay.io/fiware/tutorials.context-provider
    hostname: iot-sensors
    container_name: fiware-tutorial
    depends_on:
      - orion
      - iot-agent
    expose:
      - "3000"
      - "3001"
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - "MONGO_URL=mongodb://mongo-db:27017"
      - "DEBUG=tutorial:*"
      - "WEB_APP_PORT=3000"
      - "IOTA_HTTP_HOST=iot-agent"
      - "IOTA_HTTP_PORT=7896"
      - "DUMMY_DEVICES_PORT=3001"
      - "DUMMY_DEVICES_TRANSPORT=HTTP"
      - "DUMMY_DEVICES_API_KEY=4jggokgpepnvsb2uv4s40d59ov"
      - "CONTEXT_BROKER=http://orion:1026/v2"

  cygnus:
    image: quay.io/fiware/cygnus-ngsi:latest
    hostname: cygnus
    container_name: fiware-cygnus
    depends_on:
      - mongo-db
    expose:
      - "5080"
    ports:
      - "5051:5051"
      - "5080:5080"
    environment:
      - "CYGNUS_MONGO_HOSTS=mongo-db:27017"
      - "CYGNUS_MONGO_SERVICE_PORT=5051"
      - "CYGNUS_LOG_LEVEL=DEBUG"
      - "CYGNUS_API_PORT=5080"
      - "CYGNUS_SERVICE_PORT=5051"

  grafana:
    image: grafana/grafana
    hostname: grafana
    container_name: grafana
    depends_on:
      - mongo-db
    ports:
      - "3030:3030"

  # ============================================================================
  # 4. PROXY DE INTEGRAÇÃO (tutorials.IoT-Agent - Node.js/TS na Porta 4000)
  #    Recebe POST /send-data-sensors do Node-RED e envia ao IoT-Agent (7896)
  # ============================================================================
  proxy-integracao:
    build: ./no-commenter-project/mqda/iot-fiware/tutorials.IoT-Agent
    container_name: velha_proxy_integracao
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./no-commenter-project/mqda/iot-fiware/tutorials.IoT-Agent/src:/app/src
      - ./no-commenter-project/mqda/iot-fiware/tutorials.IoT-Agent/provisionar_arquitetura_velha.js:/app/provisionar_arquitetura_velha.js
      - ./monitoramento:/app/monitoramento
    environment:
      - PORT=4000
      - ORION_URL=http://orion:1026
      - IOTA_NORTH_URL=http://iot-agent:4041
      - IOTA_SOUTH_URL=http://iot-agent:7896
      - MONGO_URL=mongodb://mongo-db:27017
      - CHIRPSTACK_PG_HOST=postgres
      - CHIRPSTACK_PG_PORT=5432
      - CHIRPSTACK_PG_USER=chirpstack
      - CHIRPSTACK_PG_PASSWORD=chirpstack
      - CHIRPSTACK_PG_DB=chirpstack
      - NODERED_WEBHOOK_URL=http://velha_nodered:1880/chirpstack
      - USAR_AGENTE=${USAR_AGENTE:-0}
      - AGENTE_IA_URL=http://velha_agente_ia:5000/avaliar
    depends_on:
      - orion
      - iot-agent
      - mongo-db
      - chirpstack
      - nodered

  # ============================================================================
  # 4.1 SERVIÇO DO AGENTE INTELIGENTE V4 (Opcional - Sobe apenas quando USAR_AGENTE=1)
  # ============================================================================
  agente-ia:
    profiles:
      - agente
    build: ../Arquitetura_Nova
    container_name: velha_agente_ia
    restart: unless-stopped
    command: python /app/servico_agente_velha.py
    ports:
      - "5000:5000"
    volumes:
      - ../Arquitetura_Nova/agente:/app/agente
      - ./servico_agente_velha.py:/app/servico_agente_velha.py
    environment:
      - PORT=5000
      - APP_TESTE=${APP_TESTE:-0}

  # ============================================================================
  # 5. SIMULADOR LORAWAN (Opcional - Sobe com .\iniciar_docker.ps1 -d -t)
  # ============================================================================
  lwn-simulator:
    profiles:
      - teste
    build: ../Arquitetura_Nova/configuration/lwn-simulator
    container_name: velha_lwn_simulator
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ../Arquitetura_Nova/configuration/lwn-simulator/lwnsimulator:/app/lwnsimulator
    depends_on:
      - chirpstack-gateway-bridge
      - chirpstack
      - proxy-integracao

volumes:
  velha_postgresqldata:
  velha_redisdata:
  velha_mongo_db:

